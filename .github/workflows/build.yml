name: build-ffmpeg

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: FFmpeg ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      # TODO(security): pin third-party actions to full commit SHAs before the first release.
      - uses: actions/checkout@v4

      - name: Load pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm make pkg-config meson ninja-build cmake

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache FFmpeg source tarball
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.xz
          key: ffmpeg-src-${{ env.FFMPEG_VERSION }}-${{ env.FFMPEG_SHA256 }}

      # The codec libraries only change with versions.env or their build script.
      - name: Cache codec libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.abi }}/deps
          key: deps-${{ matrix.abi }}-${{ hashFiles('versions.env', 'scripts/build-deps.sh') }}

      - name: Build codec libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-deps.sh "${{ matrix.abi }}" 2>&1 | tee build-log.txt

      - name: Build FFmpeg
        run: bash scripts/build-ffmpeg.sh "${{ matrix.abi }}" 2>&1 | tee build-log.txt

      - name: Check license (LGPL v2.1+ only)
        run: bash scripts/check-license.sh "out/${{ matrix.abi }}/config.h"

      - name: Check 16 KB alignment
        run: bash scripts/check-alignment.sh "out/${{ matrix.abi }}"

      # Workflow logs need a sign-in to download, but annotations are public: report the end
      # of the failing build log (and FFmpeg's configure log) as error annotations.
      - name: Report build failure
        if: failure()
        run: |
          report() {
            [[ -f "$1" ]] || return 0
            local text
            text="$(tail -n "$2" "$1" | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=$3 (${{ matrix.abi }})::${text}"
          }
          report build-log.txt 60 "Build log tail"
          report "build/${{ matrix.abi }}/ffmpeg/ffbuild/config.log" 40 "FFmpeg config.log tail"

      - name: Size report
        run: |
          {
            echo "### FFmpeg ${FFMPEG_VERSION} - ${{ matrix.abi }}"
            echo '```'
            du -b out/${{ matrix.abi }}/lib/*.so out/${{ matrix.abi }}/bin/*
            echo "TOTAL lib/*.so: $(du -cb out/${{ matrix.abi }}/lib/*.so | tail -1 | cut -f1) bytes"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ matrix.abi }}
          path: out/${{ matrix.abi }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - name: Check tag matches the pinned FFmpeg version
        run: |
          case "$GITHUB_REF_NAME" in
            "v${FFMPEG_VERSION}-"*) ;;
            *) echo "Tag $GITHUB_REF_NAME must be v${FFMPEG_VERSION}-<build number>" >&2; exit 1 ;;
          esac

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "FFmpeg ${FFMPEG_VERSION} for Android (${GITHUB_REF_NAME})" \
            --notes-file RELEASE_NOTES.md
